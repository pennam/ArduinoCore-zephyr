# CI workflow to build, package and upload a specific tool.

name: Package and upload tool

on:
  push:
    branches:
      - '**'
    tags:
      - 'tool/**'
    paths:
      - 'tools/**'
      - 'extra/package_tool.sh'
  pull_request:
    paths:
      - 'tools/**'
      - 'extra/package_tool.sh'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.actor }}
  cancel-in-progress: true

env:
  # use the head SHA for PR hashes, instead of the merge commit
  HEAD_REF: ${{ github.event.pull_request.head.sha || github.ref }}
  IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/tool/') }}

jobs:

  build-tools:
    name: Compile tool(s)
    runs-on: ubuntu-latest
    outputs:
      TOOL_NAME: ${{ env.TOOL_NAME }}
      VERSION: ${{ env.VERSION }}
      TOOL_ARTIFACT: ${{ env.TOOL_ARTIFACT }}
      IS_RELEASE: ${{ env.IS_RELEASE }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'ignore'
          fetch-depth: 0
          persist-credentials: false
          fetch-tags: true # needed for get_core_version.sh
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false

      - name: Package tool (release)
        if: fromJSON(env.IS_RELEASE)
        run: extra/package_tool.sh ${{ github.ref }}

      - name: Build all tools (validation)
        if: ${{ !fromJSON(env.IS_RELEASE) }}
        run: |
          for tool_dir in tools/*/; do
            [ -f "$tool_dir/go.mod" ] && extra/package_tool.sh "$tool_dir"
          done
          echo "TOOL_ARTIFACT=tools-dev" >> "$GITHUB_ENV"

      - name: Upload tool archives
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.TOOL_ARTIFACT }}
          path: |
            distrib/*.tar.gz
            distrib/*.zip
          retention-days: 1

      - name: Upload tool description JSON
        uses: actions/upload-artifact@v7
        with:
          path: distrib/*.json
          archive: ${{ !fromJSON(env.IS_RELEASE) }}

  verify-tools:
    name: Verify tools
    runs-on: ubuntu-latest
    if: always()
    needs:
      - build-tools
    steps:
      - name: Check build result
        run: |
          # The following will error if the build step detects any issue
          [ "${{ needs.build-tools.result }}" == "success" ]

  # Upload the built tool packages to the S3 bucket for public distribution.

  publish-tool:
    name: Publish tool
    if: ${{ fromJSON(needs.build-tools.outputs.IS_RELEASE) && github.repository == 'arduino/ArduinoCore-zephyr' }}
    runs-on: ubuntu-latest
    needs:
      - build-tools
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:

      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build-tools.outputs.TOOL_ARTIFACT }}
          path: .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.IAM_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload tools to S3
        run: |
          for f in *.tar.gz *.zip ; do
            aws s3 cp "$f" s3://${{ secrets.S3_BUCKET }}/
          done

